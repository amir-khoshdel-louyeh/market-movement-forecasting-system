name: ci
on:
  push:
    branches: [main, local_commit]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy
      - name: Lint
        run: ruff check .
      - name: Type
        run: mypy src --ignore-missing-imports || true
      - name: Tests
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=40 -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mmfs:ci .
