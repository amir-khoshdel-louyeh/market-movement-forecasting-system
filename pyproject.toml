[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-movement-forecasting-system"
version = "0.1.0"
description = "Market Movement Forecasting: Binance streaming, LSTM/Transformer ensemble, SQLite persistence, threshold backtest and Flask GUI"
authors = [{ name = "Amir" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "Flask>=3.0",
    "Flask-Cors>=4.0",
    "Flask-Limiter>=3.5",
    "requests>=2.32",
    "numpy>=1.26",
    "torch>=2.0",
    "safetensors>=0.4",
]

[project.scripts]
mmfs-stream = "src.mmfs_stream:main"

[tool.setuptools.packages.find]
where = ["."]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.8", "safetensors", "Flask-Cors", "Flask-Limiter"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","W","I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 40
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=40"
